<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fundraising Toolkit · Sleep Out 2026</title>
<meta name="description" content="Ready-to-send emails, posts and messages for your Sleep Out fundraising page.">
<meta name="theme-color" content="#0B0B11">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23A100FF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="page--sub">
<a class="skip-link" href="#main">Skip to content</a>

<header class="nav is-stuck" id="nav">
  <a class="nav__brand" href="index.html">
    <span class="nav__mark" aria-hidden="true"></span>
    <span>Accenture × Covenant House</span>
  </a>
  <nav class="nav__links" aria-label="Sections">
    <a href="index.html">← Back to Sleep Out 2026</a>
  </nav>
  <a class="nav__cta" data-link="REGISTRATION" href="#">Join the Sleep Out</a>
  <div class="nav__progress" id="navProgress" aria-hidden="true"></div>
</header>

<main id="main">
  <section class="section subhead">
    <div class="wrap">
      <p class="eyebrow" id="toolkitLabel"></p>
      <h1 class="display" id="toolkitHeading"></h1>
      <p class="lede" id="toolkitLede" style="margin-top:1.25rem"></p>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="wrap">
      <div class="toolkit__link-field">
        <label class="visually-hidden" for="linkInput">Your fundraising page link</label>
        <input class="toolkit__input" id="linkInput" type="url" autocomplete="url">
        <p class="toolkit__hint">Paste your link once and every message below updates with it.</p>
      </div>

      <div class="templates" id="templates"></div>
      <div class="tips" id="tips"></div>

      <div class="btn-row" style="margin-top:clamp(3rem,6vw,4.5rem)">
        <a class="btn" href="index.html">
          <span>Back to Sleep Out 2026</span>
        </a>
        <a class="btn btn--ghost" data-link="REGISTRATION" href="#">
          <span>Register</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap">
    <div class="footer__grid">
      <ul class="footer__links" id="footerLinks"></ul>
      <div>
        <p class="footer__note" id="footerSources"></p>
        <p class="footer__note" id="footerDisclaimer"></p>
      </div>
    </div>
    <div class="footer__meta">
      <span id="footerMetaLeft"></span>
      <span id="footerMetaRight"></span>
    </div>
  </div>
</footer>

<noscript>
  <div style="padding:2rem;background:#14141A;color:#F2F0ED;text-align:center">
    This page uses JavaScript to load the message templates.
  </div>
</noscript>

<script src="assets/js/content.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
